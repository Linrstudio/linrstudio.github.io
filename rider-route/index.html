<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#fff7f0" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <script>try{var _sv=JSON.parse(localStorage.getItem("songdanlu_save_v1")||"null");var _th=_sv&&_sv.theme;if(_th!=="dark"&&_th!=="light"){_th="light";}document.documentElement.setAttribute("data-theme",_th);}catch(e){}</script>
    <title>骑手送单路</title>
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
    </style>
    <style>
      :root {
        --bg: #fff7f0; --bg2: #ffeef4;
        --panel: #fffdf9; --panel2: #fff1e4;
        --ink: #4a3532; --ink2: #a07a70;
        --line: #f3d9c8;
        --accent: #f0567a; --accent-soft: #ffd9e2;
        --btn-mint: #dff3e2; --btn-peach: #ffe3d0; --btn-lemon: #ffefc2;
        --gold: #ffb703; --good: #2fa36b; --bad: #e0483e;
        --street: #f7ead2; --street-edge: #c09554; --walk: #fffaf0; --slab: #dbb87c; --slab2: #bd8f4c;
        --lane: #d9b47e; --cross: rgba(190, 145, 95, .38); --ground: #ead29f;
        --shadow: 0 8px 22px rgba(160, 90, 70, .16);
        --shadow-sm: 0 3px 10px rgba(160, 90, 70, .13);
        --blocks: #ffe3ec, #dff3e2, #fff3c4, #ddebfd, #efe3fb, #ffe8d6;
      }
      :root { color-scheme: light; }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #1d1620; --bg2: #241a24;
          --panel: #2c2230; --panel2: #372a3a;
          --ink: #f5e9ec; --ink2: #bd9aa8;
          --line: #4c3a4a;
          --accent: #f4708f; --accent-soft: #59303f;
          --btn-mint: #2c4638; --btn-peach: #4a3428; --btn-lemon: #4d4023;
          --street: #4a3f63; --street-edge: #372c4e; --walk: #5b4c78; --slab: #171029; --slab2: #0d0819;
          --lane: #9a8cc4; --cross: rgba(232, 226, 255, .30); --ground: #201830;
          --shadow: 0 8px 22px rgba(0, 0, 0, .45);
          --shadow-sm: 0 3px 10px rgba(0, 0, 0, .42);
      }
      * { box-sizing: border-box; font-weight: 400; }
      html, body { height: 100%; }
      body {
        margin: 0; color: var(--ink);
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      h1, h2, p { margin: 0; }
      button { font-family: inherit; color: inherit; }

      .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .hidden { display: none !important; }

      /* ---------- top bar ---------- */
      .topbar {
        display: flex; align-items: center; gap: .5rem;
        padding: .38rem .8rem .2rem;
      }
      .topbar .title { flex: 1; min-width: 0; }
      .topbar h1 { font-size: 1.22rem; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .topbar .sub { font-size: .74rem; color: var(--ink2); margin-top: .1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .btn {
        min-height: 2.5rem; padding: 0 1rem; border-radius: 999px;
        border: 1.5px solid var(--line); background: var(--panel);
        font-size: .92rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .3rem;
        white-space: nowrap; box-shadow: var(--shadow-sm);
      }
      .btn:active { transform: scale(.97); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 5px 14px rgba(240, 86, 122, .32); }
      .btn.primary:disabled { opacity: .4; }
      .btn:disabled { opacity: .45; cursor: default; }
      .btn.small { min-height: 2.25rem; padding: 0 .7rem; font-size: .82rem; }
      .iconbtn {
        width: 2.5rem; height: 2.5rem; min-height: 2.5rem; border-radius: 50%;
        border: 1.5px solid var(--line); background: var(--panel);
        font-size: 1.05rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none;
        box-shadow: var(--shadow-sm);
      }

      /* ---------- level select ---------- */
      .cards {
        flex: 1; min-height: 0; overflow-y: auto;
        display: flex; flex-wrap: wrap; gap: .6rem;
        padding: .45rem .6rem 1.4rem; align-content: flex-start; align-items: flex-start;
      }
      .card {
        background: var(--panel); border: 1.5px solid var(--line); border-radius: 1.1rem;
        padding: .5rem .6rem .55rem; cursor: pointer; text-align: left;
        width: calc(50% - .3rem); flex: none;
        overflow: hidden; box-shadow: var(--shadow-sm);
      }
      .card:active { transform: scale(.98); }
      .card.locked { opacity: .55; cursor: default; }
      .card .thumb { position: relative; width: 100%; border-radius: .6rem; overflow: hidden; background: transparent; }
      .card .thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      @media (min-width: 700px) {
        .card { width: calc(33.333% - .4rem); }
      }
      .card .cname { font-size: .95rem; margin-top: .3rem; display: flex; align-items: baseline; gap: .35rem; }
      .card .cname .no { color: var(--accent); font-size: .8rem; }
      .card .cstars { font-size: .8rem; color: var(--gold); letter-spacing: .12em; min-height: 1.1em; }
      .card .clock { font-size: .78rem; color: var(--ink2); margin-top: .35rem; }

      /* ---------- game HUD ---------- */
      .hud { padding: .15rem .8rem 0; display: flex; gap: .5rem; align-items: stretch; }
      .chip {
        background: var(--panel); border: 1.5px solid var(--line); border-radius: .8rem;
        padding: .3rem .7rem; font-size: .95rem; display: flex; align-items: center; gap: .45rem;
        box-shadow: var(--shadow-sm);
      }
      .chip .lab { font-size: .72rem; color: var(--ink2); }
      .chip .val { font-size: 1.05rem; }
      .chip.over .val { color: var(--bad); }
      .pips { flex: 1; display: flex; align-items: center; gap: .3rem; overflow: hidden; }
      .pip { position: relative; display: inline-flex; align-items: center; line-height: 1; }
      .pip svg { width: 1.65rem; height: 1.75rem; display: block; }
      .pip.done { opacity: .42; filter: grayscale(.75); }
      .pip .tick {
        position: absolute; right: -.28em; top: -.32em; font-size: .62rem; color: #fff;
        background: var(--good); border-radius: 50%; width: 1.25em; height: 1.25em;
        display: none; align-items: center; justify-content: center;
      }
      .pip.done .tick { display: inline-flex; }
      .pip.next { animation: pippulse 1.25s ease-in-out infinite; }
      .pip.next svg { filter: drop-shadow(0 0 5px rgba(240, 86, 122, .55)); }
      @keyframes pippulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.16); }
      }

      /* ---------- board ---------- */
      #screen-game { position: relative; }
      .boardwrap {
        position: absolute; inset: 0;
        padding: calc(env(safe-area-inset-top, 0px) + 6.55rem) .12rem calc(env(safe-area-inset-bottom, 0px) + 4.4rem);
      }
      .boardwrap.shake { animation: shake .3s ease; }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        55% { transform: translateX(5px); }
        80% { transform: translateX(-3px); }
      }
      svg#board { width: 100%; height: 100%; display: block; touch-action: none; }
      .toast {
        position: absolute; top: calc(env(safe-area-inset-top, 0px) + 6.7rem); left: 50%; transform: translateX(-50%) translateY(-4px);
        background: var(--ink); color: var(--bg); font-size: .8rem; padding: .32rem .8rem;
        border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
        white-space: nowrap; z-index: 5;
      }
      .toast.show { opacity: .94; transform: translateX(-50%) translateY(0); }

      /* svg bits */
      .walk { stroke: var(--walk); stroke-width: 41; stroke-linecap: round; }
      .street { stroke: var(--street); stroke-width: 30; stroke-linecap: round; }
      .streetedge { stroke: var(--street-edge); stroke-width: 36; stroke-linecap: round; }
      .lane { fill: none; stroke: var(--lane); stroke-width: 3; stroke-dasharray: 9 13; stroke-linecap: round; opacity: .6; }
      .crossline { stroke: var(--cross); stroke-width: 4.2; stroke-linecap: round; }
      .wheelg.spinning { animation: wheelspin .5s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes wheelspin { to { transform: rotate(360deg); } }
      .streetblocked { stroke: var(--street-edge); stroke-width: 26; stroke-linecap: round; stroke-dasharray: 4 10; opacity: .7; }
      .pathunder { fill: none; stroke: #ffffff; stroke-width: 21; stroke-linejoin: round; stroke-linecap: round; opacity: .92; }
      .pathline { fill: none; stroke: var(--accent); stroke-width: 11; stroke-linejoin: round; stroke-linecap: round; }
      :root[data-theme="dark"] .pathunder { stroke: #2b2145; }
      .hintseg { stroke: var(--gold); stroke-width: 13; stroke-linecap: round; stroke-dasharray: 2 14; animation: hintdash 0.7s linear infinite; }
      @keyframes hintdash { to { stroke-dashoffset: -16; } }
      .onearrow { fill: none; stroke: #d98a7d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
      :root[data-theme="dark"] .onearrow { stroke: #e8a294; }
      .nodebadge { stroke: #fff; stroke-width: 3.5; }
      :root[data-theme="dark"] .nodebadge { stroke: #2c2230; }
      .badgepill { fill: var(--ink); }
      .badgetext { fill: #fff; font-size: 12.5px; text-anchor: middle; }
      .foodicon { font-size: 21px; text-anchor: middle; dominant-baseline: central; }
      .starticon { font-size: 22px; text-anchor: middle; dominant-baseline: central; }
      .heartfly { animation: heartfly 0.95s ease-out forwards; }
      @keyframes heartfly {
        0% { transform: translateY(0) scale(.5); opacity: 0; }
        18% { opacity: 1; }
        100% { transform: translateY(-46px) scale(1.05); opacity: 0; }
      }
      .animalpop { animation: animalpop 1.25s ease forwards; transform-box: fill-box; transform-origin: center; }
      @keyframes animalpop {
        0% { transform: scale(0); opacity: 0; }
        22% { transform: scale(1.15); opacity: 1; }
        38% { transform: scale(1); }
        78% { transform: scale(1); opacity: 1; }
        100% { transform: scale(.6) translateY(-10px); opacity: 0; }
      }
      .floattext { animation: floatup 1s ease-out forwards; font-size: 17px; text-anchor: middle; fill: var(--bad); }
      @keyframes floatup {
        0% { transform: translateY(0); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-30px); opacity: 0; }
      }
      .speedline { stroke: var(--ink2); stroke-width: 2.4; stroke-linecap: round; opacity: 0; animation: speedfly .38s ease-out forwards; }
      @keyframes speedfly {
        0% { opacity: 0; transform: translateX(10px); }
        30% { opacity: .5; }
        100% { opacity: 0; transform: translateX(var(--sx, -46px)); }
      }
      .riderbob { animation: bob .34s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2.2px); } }
      .packbob { animation: packbob 2.6s ease-in-out infinite alternate; }
      @keyframes packbob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) {
        .riderbob, .hintseg, .wheelg.spinning, .packbob, .speedline, .pip.next { animation: none; }
      }

      /* ---------- controls ---------- */
      .controls {
        display: flex; gap: .5rem; padding: .25rem .6rem .35rem; align-items: center;
      }
      .controls .btn {
        flex: 1 1 0; min-width: 0; min-height: 2.8rem; padding: 0 .35rem;
        font-size: .93rem; border-radius: 1.1rem;
        border: 2px solid rgba(255, 255, 255, .7);
        box-shadow: 0 4px 10px rgba(160, 90, 70, .16), inset 0 -3px 0 rgba(120, 60, 40, .08);
        transition: transform .18s cubic-bezier(.34, 1.8, .5, 1), box-shadow .18s ease;
      }
      :root[data-theme="dark"] .controls .btn { border-color: rgba(255, 255, 255, .16); box-shadow: 0 4px 10px rgba(0, 0, 0, .35), inset 0 -3px 0 rgba(0, 0, 0, .18); }
      .controls .btn:active { transform: scale(.92); }
      .controls .btn::before { font-size: 1.02rem; line-height: 1; }
      #undoBtn { background: var(--btn-mint); }
      #undoBtn::before { content: "↩"; }
      #clearBtn { background: var(--btn-peach); }
      #clearBtn::before { content: "✎"; }
      #hintBtn { background: var(--btn-lemon); }
      #hintBtn::before { content: "💡"; font-size: .92rem; }
      .controls .btn.primary {
        flex: 1.25 1 0; background: var(--accent); border-color: rgba(255, 255, 255, .55);
        box-shadow: 0 6px 14px rgba(240, 86, 122, .38), inset 0 -3px 0 rgba(150, 20, 55, .22);
      }
      #goBtn::before { content: "🛵"; }
      .hintleft { font-size: .74rem; color: var(--ink2); }

      /* ---------- floating bars (game screen) ---------- */
      /* The board fills the whole screen underneath; the top and bottom
         bars float as compact capsules over the page background in the
         strips the board's padding reserves, so no button ever sits on
         top of a node or a street. */
      .floatbar {
        position: absolute; left: .5rem; right: .5rem; z-index: 6;
        background: var(--panel); border: 1.5px solid var(--line); border-radius: 1rem;
        box-shadow: var(--shadow-sm); padding: .38rem .5rem;
      }
      .ftop { top: calc(env(safe-area-inset-top, 0px) + .45rem); }
      .fbot { bottom: calc(env(safe-area-inset-bottom, 0px) + .45rem); padding: .42rem .5rem; }
      .frow { display: flex; align-items: center; gap: .4rem; }
      .frow .title { flex: 0 1 auto; min-width: 0; display: flex; align-items: baseline; gap: .35rem; }
      .frow .title h1 { font-size: .98rem; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .frow .title .sub { font-size: .7rem; color: var(--ink2); white-space: nowrap; }
      .frow .iconbtn { width: 2.15rem; height: 2.15rem; min-height: 2.15rem; font-size: .95rem; }
      .frow .btn.small { min-height: 2.15rem; padding: 0 .55rem; font-size: .8rem; }
      .frow .chip { padding: .22rem .55rem; font-size: .88rem; gap: .35rem; }
      .frow .chip .val { font-size: .95rem; }
      /* task row: the orders still to deliver, big and unmissable */
      .taskrow {
        display: flex; align-items: center; gap: .55rem; margin-top: .34rem;
        background: var(--panel2); border-radius: .9rem; padding: .32rem .55rem;
      }
      .todobadge {
        background: var(--accent); color: #fff; border-radius: 999px;
        padding: .3rem .72rem; font-size: .9rem; white-space: nowrap; flex: none;
        box-shadow: 0 3px 9px rgba(240, 86, 122, .32);
      }
      .todobadge.done { background: var(--good); box-shadow: 0 3px 9px rgba(47, 163, 107, .3); }
      .taskrow .pip svg { width: 1.85rem; height: 1.95rem; }
      .fbot .controls { padding: 0; }
      @media (max-width: 460px) {
        .frow { gap: .3rem; }
        .frow .chip { padding: .22rem .45rem; }
        .frow .chip .lab { display: none; }
        .taskrow .pip svg { width: 1.62rem; height: 1.72rem; }
        .todobadge { font-size: .84rem; padding: .28rem .6rem; }
      }

      /* ---------- win modal ---------- */
      .overlay {
        position: fixed; inset: 0; background: rgba(74, 40, 45, .38);
        display: grid; place-items: center; z-index: 20; padding: 1rem;
      }
      .modal {
        background: var(--panel); border-radius: 1.5rem; box-shadow: var(--shadow);
        width: min(88vw, 21rem); padding: 1.3rem 1.2rem 1.1rem; text-align: center;
      }
      .modal h2 { font-size: 1.3rem; }
      .modal .stars { margin: .55rem 0 .2rem; display: flex; justify-content: center; gap: .35rem; }
      .modal .stars svg { width: 2.5rem; height: 2.5rem; }
      .starpath { fill: #ead9d2; }
      .starpath.on { fill: var(--gold); }
      :root[data-theme="dark"] .starpath { fill: #554458; } :root[data-theme="dark"] .starpath.on { fill: var(--gold); }
      .modal .eureka {
        margin: .6rem auto .2rem; background: var(--panel2); border-radius: .9rem;
        padding: .6rem .8rem; font-size: .95rem; line-height: 1.5;
      }
      .modal .eureka .elab { display: block; font-size: .7rem; color: var(--accent); margin-bottom: .15rem; }
      .modal .tipnote { font-size: .8rem; color: var(--bad); margin-top: .45rem; min-height: 1em; }
      .modal .mrow { display: flex; gap: .5rem; margin-top: .9rem; }
      .modal .mrow .btn { flex: 1; }
      .modal .stepsline { font-size: .85rem; color: var(--ink2); margin-top: .3rem; }
    </style>
  </head>
  <body>
    <!-- ======== level select ======== -->
    <section class="screen" id="screen-select">
      <div class="topbar">
        <div class="title">
          <h1 data-i18n="gameTitle">骑手送单路</h1>
          <p class="sub" data-i18n="gameSub">画一条路线，送完所有单</p>
        </div>
        <button class="iconbtn" id="themeBtn1" type="button" aria-label="day / night"></button>
        <button class="btn small" id="langBtn1" type="button">EN</button>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- ======== game ======== -->
    <section class="screen hidden" id="screen-game">
      <div class="boardwrap" id="boardWrap">
        <svg id="board" preserveAspectRatio="xMidYMid meet" aria-label="map"></svg>
        <div class="toast" id="toast"></div>
      </div>
      <div class="floatbar ftop">
        <div class="frow">
          <button class="iconbtn" id="backBtn" type="button" aria-label="back">←</button>
          <div class="title">
            <h1 id="lvlTitle">第一单</h1>
            <p class="sub" id="lvlSub">第 1 关</p>
          </div>
          <div class="chip" id="stepsChip"><span class="lab" data-i18n="steps">步数</span><span class="val" id="stepsVal">0 / 15</span></div>
          <button class="iconbtn" id="themeBtn2" type="button" aria-label="day / night"></button>
          <button class="btn small" id="langBtn2" type="button">EN</button>
        </div>
        <div class="taskrow">
          <span class="todobadge" id="todoBadge"></span>
          <div class="pips" id="pips"></div>
        </div>
      </div>
      <div class="floatbar fbot">
        <div class="controls">
          <button class="btn" id="undoBtn" type="button" data-i18n="undo">撤销</button>
          <button class="btn" id="clearBtn" type="button" data-i18n="clear">重画</button>
          <button class="btn" id="hintBtn" type="button"><span data-i18n="hint">提示</span><span class="hintleft" id="hintLeft"></span></button>
          <button class="btn primary" id="goBtn" type="button" data-i18n="go">出发</button>
        </div>
      </div>
    </section>

    <!-- ======== win modal ======== -->
    <div class="overlay hidden" id="winOverlay">
      <div class="modal">
        <h2 data-i18n="winTitle">送完啦！</h2>
        <div class="stars" id="winStars"></div>
        <p class="stepsline" id="winSteps"></p>
        <div class="eureka"><span class="elab" data-i18n="eurekaLab">顿悟点</span><span id="winEureka"></span></div>
        <p class="tipnote" id="winTipNote"></p>
        <div class="mrow">
          <button class="btn" id="winLevelsBtn" type="button" data-i18n="levels">选关</button>
          <button class="btn" id="winReplayBtn" type="button" data-i18n="replay">再玩一次</button>
          <button class="btn primary" id="winNextBtn" type="button" data-i18n="next">下一关</button>
        </div>
      </div>
    </div>

    <script>
      "use strict";
      /* ================= i18n ================= */
      const STR = {
        zh: {
          gameTitle: "骑手送单路", gameSub: "画一条路线，送完所有单",
          steps: "步数", undo: "撤销", clear: "重画", hint: "提示", go: "出发",
          winTitle: "送完啦！", eurekaLab: "顿悟点", levels: "选关", replay: "再玩一次", next: "下一关",
          levelN: n => "第 " + n + " 关",
          todoLeft: n => "待送 " + n + " 单",
          locked: "完成上一关解锁",
          oneway: "单行道，不能逆行", blocked: "这条路在修，走不通",
          needPickup: "先去冰淇淋店取货", overBudget: "步数超了，试试更短的路线",
          leftOrders: n => "还差 " + n + " 单没安排", ready: "可以出发啦",
          tipLost: "小费飞走了…下次注意特殊单",
          winSteps: (s, o) => "用了 " + s + " 步 · 最优 " + o + " 步",
          intro: [
            "单行道只能顺着箭头走", "修路的地方画不过去", "热乎单要在 8 步内送到",
            "跟着箭头走，别逆行", "电梯坏的楼，送一单多 3 步", "先取冰淇淋，6 步内送到",
            "顺路的单，一趟送完", "步数很紧，先想好再画", "热的、冰的、爬楼的，都赶上了",
            "预算只比最优多 2 步", "两单都热，先送限时短的", "冰柜藏在巷子最里面",
            "大环套小环，方向不一样", "河只有一座桥，在最南边", "路过爬楼单，先别急着送",
            "四个单都在环上", "两条河，桥一南一北", "先兜远路，热单压线送",
            "过河之前，先清完西岸", "去程南桥，回程北桥"

      /* ================= graph helpers ================= */
      const nkey = (x, y) => x + "," + y;
      const ekey = (a, b) => [nkey(a[0], a[1]), nkey(b[0], b[1])].sort().join("|");
      const idx = (L, x, y) => y * L.cols + x;
      const xyOf = (L, i) => [i % L.cols, Math.floor(i / L.cols)];

      function buildGraph(L) {
        const blocked = new Set(L.blocked.map(([a, b]) => ekey(a, b)));
        const oneway = new Map();
        for (const [f, t] of L.oneway) oneway.set(ekey(f, t), nkey(f[0], f[1]) + ">" + nkey(t[0], t[1]));
        const adj = new Map(); // nodeIdx -> [nodeIdx] allowed moves
        const edges = [];      // drawable streets {a, b, blocked}
        const dirs = [[1, 0], [0, 1]];
        for (let y = 0; y < L.rows; y++) for (let x = 0; x < L.cols; x++) adj.set(idx(L, x, y), []);
        for (let y = 0; y < L.rows; y++) for (let x = 0; x < L.cols; x++) {
          for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= L.cols || ny >= L.rows) continue;
            const ek = ekey([x, y], [nx, ny]);
            if (blocked.has(ek)) continue;
            const ow = oneway.get(ek);
            if (ow && ow !== nkey(x, y) + ">" + nkey(nx, ny)) continue;
            adj.get(idx(L, x, y)).push(idx(L, nx, ny));
          }
          for (const [dx, dy] of dirs) {
            const nx = x + dx, ny = y + dy;
            if (nx >= L.cols || ny >= L.rows) continue;
            edges.push({ a: idx(L, x, y), b: idx(L, nx, ny), blocked: blocked.has(ekey([x, y], [nx, ny])) });
          }
        }
        return { adj, edges, blocked, oneway };
      }

      // Evaluate a drawn path: steps, per-order arrival steps, specials status
      function evalPath(L, path) {
        const orderAt = new Map(L.orders.map((o, i) => [idx(L, o.at[0], o.at[1]), i]));
        const pickupIdx = L.pickup ? idx(L, L.pickup[0], L.pickup[1]) : -1;
        let steps = 0, pickupStep = null;
        const arrivals = new Map();
        for (let s = 1; s < path.length; s++) {
          steps += 1;
          const node = path[s];
          const oi = orderAt.get(node);
          if (oi !== undefined && !arrivals.has(oi)) {
            const o = L.orders[oi];
            if (o.kind === "cold") {
              if (pickupStep !== null) arrivals.set(oi, steps);
            } else {
              if (o.kind === "lift") steps += 3;
              arrivals.set(oi, steps);
            }
          }
          if (node === pickupIdx && pickupStep === null) pickupStep = steps;
        }
        const coldIdx = L.orders.findIndex(o => o.kind === "cold");
        const hotIdx = L.orders.findIndex(o => o.kind === "hot");
        let coldWindow = null;
        if (coldIdx >= 0 && arrivals.has(coldIdx) && pickupStep !== null) coldWindow = arrivals.get(coldIdx) - pickupStep;
        return {
          steps, arrivals, pickupStep,
          delivered: arrivals.size,
          hotMissed: L.orders.some((o, i) => o.kind === "hot" && arrivals.has(i) && arrivals.get(i) > o.limit),
          coldMissed: coldIdx >= 0 && arrivals.has(coldIdx) && coldWindow !== null && coldWindow > 6,
          coldWindow,
          coldPending: coldIdx >= 0 && !arrivals.has(coldIdx) && pickupStep !== null,
          coldNeedsPickup: coldIdx >= 0 && !arrivals.has(coldIdx) && pickupStep === null
        };
      }

      // Dijkstra (same model as the build-time verifier) — used for hints
      function solveFrom(L, G, startNode, mask, coldTimer, hotOk0, coldOk0, perfect, elapsed0) {
        const orderAt = new Map(L.orders.map((o, i) => [idx(L, o.at[0], o.at[1]), i]));
        const pickupIdx = L.pickup ? idx(L, L.pickup[0], L.pickup[1]) : -1;
        const hotIdx = L.orders.findIndex(o => o.kind === "hot");
        const coldIdx = L.orders.findIndex(o => o.kind === "cold");
        const FULL = (1 << L.orders.length) - 1;
        const start = [startNode, mask, coldTimer, hotOk0, coldOk0, elapsed0 || 0]; // last field: absolute steps so far (hot deadline check)
        return solveInner(L, G, orderAt, pickupIdx, hotIdx, coldIdx, FULL, start, perfect);
      }
      function solveInner(L, G, orderAt, pickupIdx, hotIdx, coldIdx, FULL, start, perfect) {
        const skey = s => s.slice(0, 5).join("|");
        const dist = new Map([[skey(start), 0]]);
        const prev = new Map();
        const pq = [[0, start]];
        let goal = null;
        while (pq.length) {
          let bi = 0;
          for (let i = 1; i < pq.length; i++) if (pq[i][0] < pq[bi][0]) bi = i;
          const [cost, st] = pq.splice(bi, 1)[0];
          if (cost > (dist.get(skey(st)) ?? Infinity)) continue;
          const [node, mask, ct, hotOk, coldOk, elapsed] = st;
          if (mask === FULL && (!perfect || (hotOk && coldOk))) { goal = st; break; }
          for (const nb of G.adj.get(node)) {
            let nmask = mask, nct = ct, nhot = hotOk, ncold = coldOk, sc = 1;
            const oi = orderAt.get(nb);
            if (oi !== undefined && !(mask & (1 << oi))) {
              const o = L.orders[oi];
              if (o.kind === "cold") {
                if (ct >= 0) { nmask |= (1 << oi); ncold = ct <= 6 ? 1 : 0; nct = -1; }
              } else {
                nmask |= (1 << oi);
                if (o.kind === "lift") sc += 3;
                if (o.kind === "hot") nhot = (elapsed + sc) <= o.limit ? 1 : 0;
              }
            }
            if (nb === pickupIdx && coldIdx >= 0 && !(nmask & (1 << coldIdx)) && nct < 0) nct = 0;
            else if (nct >= 0) nct = Math.min(99, nct + sc);
            const nst = [nb, nmask, nct, nhot, ncold, elapsed + sc];
            const sk = skey(nst);
            if (cost + sc < (dist.get(sk) ?? Infinity)) {
              dist.set(sk, cost + sc); prev.set(sk, skey(st)); pq.push([cost + sc, nst]);
            }
          }
        }
        if (!goal) return null;
        const nodes = [];
        let cur = skey(goal);
        while (cur) { nodes.unshift(Number(cur.split("|")[0])); cur = prev.get(cur); }
        return nodes;
      }

        $("hintBtn").disabled = cur.running || cur.hints <= 0 || ev.delivered === L.orders.length;
        $("hintLeft").textContent = " ×" + cur.hints;
      }

      /* ================= level flow ================= */
      function openLevel(id) {
        const L = LEVELS.find(l => l.id === id);
        cur = { L, G: buildGraph(L), path: [startIdxOf(L)], hints: 2, running: false, hintSeg: null, ev: null, carrying: true };
        $("screen-select").classList.add("hidden");
        $("screen-game").classList.remove("hidden");
        $("winOverlay").classList.add("hidden");
        renderLevelHead();
        renderPips();
        renderBoard();
        refreshHUD();
      }
      function backToSelect() {
        cur = null;
        $("screen-game").classList.add("hidden");
        $("winOverlay").classList.add("hidden");
        $("screen-select").classList.remove("hidden");
        renderCards();
      }
      $("backBtn").addEventListener("click", backToSelect);

      /* ================= drawing input ================= */
      let dragging = false;
      function svgPoint(evt) {
        const pt = board.createSVGPoint();
        pt.x = evt.clientX; pt.y = evt.clientY;
        const m = board.getScreenCTM();
        if (!m) return null;
        return pt.matrixTransform(m.inverse());
      }
      function nearestNode(p) {
        if (!p || !cur || !PR) return -1;
        // inverse perspective projection: screen point -> ground (u, v)
        // (undo the depth from the y coordinate first, then the horizontal
        // scale at that depth), then pick the nearest node centre in ground
        // space — the same metric the game has always used.
        const g = PR.inv(p.x, p.y);
        if (!g) return -1;
        const u = g[0], v = g[1];
        let best = -1, bd = 82;
        for (let i = 0; i < cur.L.cols * cur.L.rows; i++) {
          const [gx, gy] = xyOf(cur.L, i);
          const d = Math.hypot(u - (gx * 100 + 50), v - (gy * 100 + 50));
          if (d < bd) { bd = d; best = i; }
        }
        return best;
      }
      function classifyMove(from, to) {
        const L = cur.L, G = cur.G;
        if (G.adj.get(from).indexOf(to) >= 0) return "ok";
        const [fx, fy] = xyOf(L, from), [tx, ty] = xyOf(L, to);
        if (Math.abs(fx - tx) + Math.abs(fy - ty) !== 1) return "far";
        if (G.blocked.has(ekey([fx, fy], [tx, ty]))) return "blocked";
        return "oneway";
      }
      function tryNode(n) {
        if (!cur || cur.running || n < 0) return;
        const path = cur.path;
        const head = path[path.length - 1];
        if (n === head) return;
        const at = path.lastIndexOf(n);
        if (at >= 0) { cur.path = path.slice(0, at + 1); cur.hintSeg = null; drawPath(); refreshHUD(); return; }
        const c = classifyMove(head, n);
        if (c === "ok") { path.push(n); cur.hintSeg = null; drawPath(); refreshHUD(); }
        else if (c === "blocked") { shake(); toast(T().blocked); }
        else if (c === "oneway") { shake(); toast(T().oneway); }
      }
      board.addEventListener("pointerdown", evt => {
        if (!cur || cur.running) return;
        const n = nearestNode(svgPoint(evt));
        if (n < 0) return;
        dragging = true;
        try { board.setPointerCapture(evt.pointerId); } catch (e) {}
        if (cur.path.length === 1 && n !== startIdxOf(cur.L)) { /* must start at restaurant */ }
        tryNode(n);
        evt.preventDefault();
      });
      board.addEventListener("pointermove", evt => {
        if (!dragging || !cur || cur.running) return;
        tryNode(nearestNode(svgPoint(evt)));
      });
      ["pointerup", "pointercancel"].forEach(ev => board.addEventListener(ev, () => { dragging = false; }));

      $("undoBtn").addEventListener("click", () => {
        if (!cur || cur.running || cur.path.length <= 1) return;
        cur.path.pop(); cur.hintSeg = null; drawPath(); refreshHUD();
      });
      $("clearBtn").addEventListener("click", () => {
        if (!cur || cur.running) return;
        cur.path = [startIdxOf(cur.L)]; cur.hintSeg = null; drawPath(); refreshHUD();
      });
      $("hintBtn").addEventListener("click", () => {
        if (!cur || cur.running || cur.hints <= 0) return;
        const L = cur.L, ev = cur.ev;
        const head = cur.path[cur.path.length - 1];
        let mask = 0;
        ev.arrivals.forEach((v, k) => { mask |= (1 << k); });
        const coldI = L.orders.findIndex(o => o.kind === "cold");
        const hotI = L.orders.findIndex(o => o.kind === "hot");
        const ct = (coldI >= 0 && ev.pickupStep !== null && !ev.arrivals.has(coldI)) ? (ev.steps - ev.pickupStep) : -1;
        const anyHotArrived = L.orders.some((o, i) => o.kind === "hot" && ev.arrivals.has(i));
        const hotOk0 = hotI < 0 ? 1 : (anyHotArrived ? (ev.hotMissed ? 0 : 1) : 0);
        const coldOk0 = coldI < 0 ? 1 : (ev.arrivals.has(coldI) ? (ev.coldMissed ? 0 : 1) : 0);
        let nodes = solveFrom(L, cur.G, head, mask, ct, hotOk0, coldOk0, true, ev.steps);
        if (!nodes) nodes = solveFrom(L, cur.G, head, mask, ct, hotOk0, coldOk0, false, ev.steps);
        if (!nodes || nodes.length < 2) return;
        cur.hints -= 1;
        cur.hintSeg = [nodes[0], nodes[1]];
        drawPath();
        refreshHUD();
        setTimeout(() => { if (cur) { cur.hintSeg = null; drawPath(); } }, 2400);
      });

      /* ================= run animation ================= */
      function heartsAt(nodeI) {
        const fx = $("layer-fx");
        if (!fx) return;
        const [x, y] = nodeXY(nodeI);
        for (let i = 0; i < 6; i++) {
          const g = el("g", { transform: "translate(" + (x + (Math.random() * 40 - 20)) + " " + (y - 16) + ") scale(1.35)" }, fx);
          const p = el("path", { d: "M0 3.5 C0 1 -2.6 -1.8 -5.4 -1.8 C-8.8 -1.8 -10.6 .8 -10.6 3.6 C-10.6 7.2 -5.4 10 0 14.6 C5.4 10 10.6 7.2 10.6 3.6 C10.6 .8 8.8 -1.8 5.4 -1.8 C2.6 -1.8 0 1 0 3.5 Z", fill: i % 2 ? "#f78fb0" : "#f0567a", stroke: "#fff", "stroke-width": "1.2", class: "heartfly" }, g);
          p.style.animationDelay = (i * 0.09) + "s";
          setTimeout(() => g.remove(), 1500);
        }
      }
      function animalAt(nodeI, i) {
        const fx = $("layer-fx");
        if (!fx) return;
        const [x, y] = nodeXY(nodeI);
        const k = nodeScale(nodeI);
        const g = el("g", { transform: "translate(" + (x + 26 * k) + " " + (y - 24 * k) + ") scale(" + k.toFixed(3) + ")", class: "animalpop" }, fx);
        el("circle", { r: 15.5, fill: "#fff", stroke: "#f3d9c8", "stroke-width": 2 }, g);
        const t = el("text", { "text-anchor": "middle", "dominant-baseline": "central", "font-size": "17px", y: 1 }, g);
        t.textContent = ANIMALS[i % ANIMALS.length];
        setTimeout(() => g.remove(), 1300);
      }
      function floatText(nodeI, txt) {
        const fx = $("layer-fx");
        if (!fx) return;
        const [x, y] = nodeXY(nodeI);
        const k = nodeScale(nodeI);
        const t = el("text", { x: x + 24 * k, y: y - 18 * k, class: "floattext" }, fx);
        t.textContent = txt;
        setTimeout(() => t.remove(), 1100);
      }
      function markDelivered(i) {
        const node = document.getElementById("orderNode" + i);
        if (!node) return;
        const chk = el("g", { transform: "translate(0 0)" }, node);
        const [x, y] = nodeXY(idx(cur.L, cur.L.orders[i].at[0], cur.L.orders[i].at[1]));
        const bg = el("circle", { cx: x - 15, cy: y - 15, r: 8.5, fill: "#2fa36b" }, node);
        const tx = el("text", { x: x - 15, y: y - 14.2, "text-anchor": "middle", "dominant-baseline": "central", "font-size": "10.5px", fill: "#fff" }, node);
        tx.textContent = "✓";
      }
      function runRoute() {
        if (!cur || cur.running) return;
        const L = cur.L, path = cur.path.slice();
        cur.running = true;
        refreshHUD();
        const rm = reducedMotion();
        const orderAt = new Map(L.orders.map((o, i) => [idx(L, o.at[0], o.at[1]), i]));
        const seen = new Set();
        let seg = 0;
        let lastStreak = 0;
        const SEG_MS = 235;
        function stepSeg() {
          if (seg >= path.length - 1) { finishRun(); return; }
          const from = path[seg], to = path[seg + 1];
          const [fx, fy] = nodeXY(from), [tx, ty] = nodeXY(to);
          const sF = nodeScale(from) * 1.32, sT = nodeScale(to) * 1.32;
          const dir = tx < fx ? -1 : 1;
          placeRider(from, dir);
          const rider = document.querySelector("#rider");
          const t0 = performance.now();
          function frame(now) {
            const k = Math.min(1, (now - t0) / SEG_MS);
            const ke = k * k * (3 - 2 * k); // smoothstep: gentle start, soft arrival
            const x = fx + (tx - fx) * ke, y = fy + (ty - fy) * ke;
            const bobY = Math.sin(now / 90) * 1.1;
            const horiz = Math.abs(tx - fx) >= Math.abs(ty - fy);
            const lean = horiz ? (dir > 0 ? 3.2 : -3.2) : 1.4;
            if (rider) rider.setAttribute("transform", "translate(" + x + " " + (y - 6 + bobY) + ") rotate(" + lean + ") scale(" + (sF + (sT - sF) * ke).toFixed(3) + ")");
            if (!rm && now - lastStreak > 120) { lastStreak = now; spawnStreak(x, y, dir); }
            if (k < 1) { requestAnimationFrame(frame); return; }
            seg += 1;
            const oi = orderAt.get(to);
            if (oi !== undefined && !seen.has(oi)) {
              seen.add(oi);
              if (seen.size === L.orders.length) { // last order out — the bag leaves the box
                cur.carrying = false;
                const cb2 = document.querySelector("#carryBag");
                if (cb2) cb2.style.display = "none";
              }
              heartsAt(to);
              animalAt(to, oi);
              markDelivered(oi);
              if (L.orders[oi].kind === "lift") floatText(to, "+3");
            }
            if (to === (L.pickup ? idx(L, L.pickup[0], L.pickup[1]) : -1)) heartsAt(to);
            setTimeout(stepSeg, L.orders[oi] && !seen.has(oi) ? 60 : 30);
          }
          requestAnimationFrame(frame);
        }
        stepSeg();
      }
      function finishRun() {
        const L = cur.L, ev = evalPath(L, cur.path);
        cur.running = false;
        placeRider(cur.path[cur.path.length - 1], 1);
        let stars;
        if (L.id === LEVELS.length) stars = ev.steps === L.opt ? 3 : (ev.steps <= L.opt + 1 ? 2 : 1);
        else stars = ev.steps <= L.opt + 1 ? 3 : (ev.steps <= L.opt + 4 ? 2 : 1);
        const missed = ev.hotMissed || ev.coldMissed;
        if (missed) stars = Math.max(1, stars - 1);
        if (stars > (save.stars[L.id] || 0)) { save.stars[L.id] = stars; persist(); }
        const starRow = $("winStars");
        starRow.innerHTML = "";
        for (let i = 0; i < 3; i++) {
          const svg = document.createElementNS(SVGNS, "svg");
          svg.setAttribute("viewBox", "0 0 24 24");
          const p = document.createElementNS(SVGNS, "path");
          p.setAttribute("d", "M12 2.6 L14.7 8.6 L21.2 9.3 L16.4 13.7 L17.8 20.1 L12 16.7 L6.2 20.1 L7.6 13.7 L2.8 9.3 L9.3 8.6 Z");
          p.setAttribute("class", "starpath" + (i < stars ? " on" : ""));
          svg.appendChild(p);
          starRow.appendChild(svg);
        }
        $("winSteps").textContent = T().winSteps(ev.steps, L.opt);
        $("winEureka").textContent = L.eureka[lang];
        $("winTipNote").textContent = missed ? T().tipLost : "";
        $("winNextBtn").style.display = L.id >= LEVELS.length ? "none" : "";
        setTimeout(() => $("winOverlay").classList.remove("hidden"), 640);
        refreshHUD();
      }
      $("goBtn").addEventListener("click", runRoute);
      $("winNextBtn").addEventListener("click", () => { if (cur && cur.L.id < LEVELS.length) openLevel(cur.L.id + 1); });
      $("winReplayBtn").addEventListener("click", () => { if (cur) openLevel(cur.L.id); });
      $("winLevelsBtn").addEventListener("click", backToSelect);

      /* ================= init ================= */
      persist();
      applyTheme();
      applyI18n();
      backToSelect();
    </script>
      <script>
      // PWA registration with proactive auto-update (same pattern as marble-game).
      if ('serviceWorker' in navigator) {
        const hadController = !!navigator.serviceWorker.controller;
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (hadController && !reloading) { reloading = true; window.location.reload(); }
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then((reg) => {
            reg.update().catch(() => {});
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update().catch(() => {});
            });
            setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
