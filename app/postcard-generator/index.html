<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff9ed">
  <meta name="description" content="制作 15 × 10 cm 双面明信片，并保存为 JPG。">
  <title>明信片编辑器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <h1>明信片</h1>
      </div>
      <span class="dimension">15 × 10 cm</span>
    </header>

    <main class="workspace">
      <section class="preview-board" aria-label="明信片预览">
        <div class="preview-topline">
          <strong id="previewTitle">正面</strong>
          <div class="side-switch" role="tablist" aria-label="明信片正反面">
            <button type="button" class="side-tab active" data-side="front" role="tab" aria-selected="true">正面</button>
            <button type="button" class="side-tab" data-side="back" role="tab" aria-selected="false">反面</button>
          </div>
        </div>
	        <div class="card-stage">
	          <div class="postcard postcard-front" id="frontCard">
	            <img id="frontPreview" src="./critical/titanic-embrace.jpg" alt="泰坦尼克号船头相拥场景" decoding="async">
	            <button type="button" class="front-placeholder" id="frontPlaceholder" aria-label="点击选择明信片正面图片" hidden><span>请设置明信片正面图</span><small>点击此处选择图片</small></button>
          </div>
          <div class="postcard postcard-back" id="backCard" role="img" aria-label="明信片反面预览" hidden>
            <img class="back-base" id="backBase" src="./critical/back-template.jpg" alt="">
            <div class="phrase-mask" aria-hidden="true"></div>
            <div class="divider-phrase" id="dividerPhrase">it's for you</div>
            <div class="preview-zip-cells" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <div class="mini-photo-wrap" id="miniPhotoWrap" hidden><img id="miniPreview" alt="背面左下角小图"></div>
          </div>
        </div>
	        <div class="preview-foot"><span id="previewHint">泰坦尼克号船头拥抱</span></div>
      </section>

      <section class="editor" aria-label="编辑选项">
        <div class="control-row photo-row">
	          <label class="front-picker" for="frontFile" id="frontDrop">
	            <span class="field-name">正面图</span>
	            <span class="front-picker-current"><span id="frontFileName">泰坦尼克号拥抱</span><b aria-hidden="true">＋</b></span>
          </label>
          <input id="frontFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
          <div class="segmented" role="group" aria-label="照片适配方式">
            <button type="button" class="segment" data-fit="contain" aria-pressed="false">完整展示</button>
            <button type="button" class="segment active" data-fit="cover" aria-pressed="true">铺满</button>
          </div>
        </div>

        <div class="control-row phrase-row">
          <label for="phraseInput">背面短句</label>
          <input id="phraseInput" type="text" maxlength="36" placeholder="it's for you" autocomplete="off" aria-label="背面竖排短句">
        </div>

        <div class="control-row mini-row">
          <span class="field-name">背面小图 <small>可选</small></span>
          <label class="mini-upload" for="miniFile" id="miniDrop">
            <span class="mini-plus" id="miniPlus" aria-hidden="true">＋</span>
            <img id="miniThumb" alt="" hidden>
            <span id="miniUploadText">添加</span>
          </label>
          <button type="button" class="remove-mini" id="removeMini" hidden>移除</button>
          <input id="miniFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        </div>
      </section>

      <section class="export-actions" aria-label="保存为 JPG">
        <button class="save-button primary-button" id="saveFront" type="button"><span>保存正面</span><b>JPG</b></button>
        <button class="save-button secondary-button" id="saveBack" type="button"><span>保存反面</span><b>JPG</b></button>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script defer src="./app.js"></script>
</body>
</html>
