<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Frame Extractor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #fafafa;
            color: #000;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .video-preview {
            margin-bottom: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
            background: #000;
        }

        .video-controls {
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #eee;
        }

        .bottom-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .left-panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .timeline-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .timeline {
            position: relative;
            height: 60px;
            background: #f5f5f5;
            border-radius: 4px;
            overflow: hidden;
        }

        .timeline-markers {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 2px;
            background: #eee;
        }

        .marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: move;
        }

        .timeline-zoom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background: #eee;
            cursor: ew-resize;
        }

        button {
            background: #000;
            color: #fff;
            border: 0;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload {
            display: inline-block;
            padding: 8px 16px;
            background: #000;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .file-name {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }

        .frames-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .frame-preview {
            background: #fff;
            padding: 8px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .frame-preview img {
            width: 100%;
            height: auto;
            border-radius: 2px;
        }

        .frame-time {
            margin-top: 4px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-preview">
            <video id="video" controls>
                <source src="" type="video/mp4">
            </video>
            <div class="video-controls">
                <button id="playBtn">播放</button>
                <button id="pauseBtn">暂停</button>
            </div>
        </div>

        <div class="bottom-container">
            <div class="left-panel">
                <label class="file-upload">
                    选择视频文件
                    <input type="file" id="videoInput" accept="video/*">
                </label>
                <div class="file-name" id="fileName">未选择文件</div>
                <button id="extractBtn" disabled>开始抽帧</button>
                <div class="frames-container" id="framesContainer"></div>
            </div>
            <div class="timeline-container">
                <div id="timeline" class="timeline">
                    <div class="timeline-markers"></div>
                    <div class="timeline-zoom"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class VideoFrameExtractor {
            constructor(video) {
                this.video = video;
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
            }

            async extractFrames(interval = 5) {
                const frames = [];
                let currentTime = 0;

                // 设置canvas尺寸
                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;

                while (currentTime < this.video.duration) {
                    this.video.currentTime = currentTime;
                    await waitForSeeked(this.video);
                    this.ctx.drawImage(this.video, 0, 0);
                    frames.push({
                        time: currentTime,
                        data: this.canvas.toDataURL('image/jpeg', 0.8)
                    });
                    currentTime += interval;
                }

                return frames;
            }
        }

        // 辅助函数：等待视频寻址完成
        function waitForSeeked(video) {
            return new Promise(resolve => {
                const onSeeked = () => {
                    video.removeEventListener('seeked', onSeeked);
                    resolve();
                };
                video.addEventListener('seeked', onSeeked);
            });
        }

        // 主程序
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video');
            const videoInput = document.getElementById('videoInput');
            const extractBtn = document.getElementById('extractBtn');
            const timeline = document.getElementById('timeline');
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const fileName = document.getElementById('fileName');
            const framesContainer = document.getElementById('framesContainer');

            let extractor = null;
            let frames = [];

            // 视频控制
            playBtn.addEventListener('click', () => video.play());
            pauseBtn.addEventListener('click', () => video.pause());

            // 文件选择处理
            videoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    video.src = URL.createObjectURL(file);
                    fileName.textContent = file.name;
                    extractor = new VideoFrameExtractor(video);
                    extractBtn.disabled = true; // 先禁用按钮
                    video.addEventListener('loadedmetadata', () => {
                        extractBtn.disabled = false;
                    }, { once: true });
                }
            });

            // 抽帧处理
            extractBtn.addEventListener('click', async () => {
                if (!extractor) return;

                extractBtn.disabled = true;
                extractBtn.textContent = '处理中...';
                video.pause(); // 暂停视频以避免干扰
                try {
                    frames = await extractor.extractFrames(5); // 每5秒抽一帧
                    renderTimeline();
                    renderFramePreviews();
                } catch (error) {
                    console.error('抽帧失败:', error);
                } finally {
                    extractBtn.textContent = '开始抽帧';
                    extractBtn.disabled = false;
                }
            });

            // 渲染时间轴
            function renderTimeline() {
                const markers = timeline.querySelector('.timeline-markers');
                markers.innerHTML = '';

                frames.forEach(frame => {
                    const marker = document.createElement('div');
                    marker.className = 'marker';
                    marker.style.left = `${(frame.time / video.duration) * 100}%`;
                    marker.draggable = true;

                    // 拖拽处理
                    marker.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', frame.time);
                    });

                    markers.appendChild(marker);
                });
            }

            // 渲染帧预览
            function renderFramePreviews() {
                framesContainer.innerHTML = '';

                frames.forEach(frame => {
                    const preview = document.createElement('div');
                    preview.className = 'frame-preview';

                    const img = document.createElement('img');
                    img.src = frame.data;

                    const time = document.createElement('div');
                    time.className = 'frame-time';
                    time.textContent = `${Math.floor(frame.time)}秒`;

                    preview.appendChild(img);
                    preview.appendChild(time);
                    framesContainer.appendChild(preview);
                });
            }

            // 时间轴缩放
            let isDragging = false;
            let startX;
            let scrollLeft;

            timeline.querySelector('.timeline-zoom').addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.pageX - timeline.offsetLeft;
                scrollLeft = timeline.scrollLeft;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const x = e.pageX - timeline.offsetLeft;
                const walk = (x - startX) * 2;
                timeline.scrollLeft = scrollLeft - walk;
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        });
    </script>
</body>
</html>
