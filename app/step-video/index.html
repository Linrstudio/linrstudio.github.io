<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Frame Extractor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #fafafa;
            color: #000;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .video-preview {
            margin-bottom: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
            background: #000;
        }

        .video-controls {
            padding: 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #eee;
        }

        .bottom-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .left-panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .timeline-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .timeline {
            position: relative;
            height: 60px;
            background: #f5f5f5;
            border-radius: 4px;
            overflow: hidden;
        }

        .timeline-markers {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 2px;
            background: #eee;
        }

        .marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: move;
        }

        .timeline-zoom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background: #eee;
            cursor: ew-resize;
        }

        button {
            background: #000;
            color: #fff;
            border: 0;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload {
            display: inline-block;
            padding: 8px 16px;
            background: #000;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .file-name {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }

        .frames-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .frame-preview {
            background: #fff;
            padding: 8px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .frame-preview img {
            width: 100%;
            height: auto;
            border-radius: 2px;
        }

        .frame-time {
            margin-top: 4px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-preview">
            <video id="video" controls>
                <source src="" type="video/mp4">
            </video>
            <div class="video-controls">
                <button id="playBtn">播放</button>
                <button id="pauseBtn">暂停</button>
            </div>
        </div>

        <div class="bottom-container">
            <div class="left-panel">
                <label class="file-upload">
                    选择视频文件
                    <input type="file" id="videoInput" accept="video/*">
                </label>
                <div class="file-name" id="fileName">未选择文件</div>
                <button id="extractBtn" disabled>开始抽帧</button>
                <div class="frames-container" id="framesContainer"></div>
            </div>
            <div class="timeline-container">
                <div id="timeline" class="timeline">
                    <div class="timeline-markers"></div>
                    <div class="timeline-zoom"></div>
                </div>
