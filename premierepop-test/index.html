<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PremierePop 本地验证 · 测试播放页</title>
<style>
  body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:#9da7b1;margin:0 0 16px;font-size:14px}
  .player{background:#000;border-radius:12px;overflow:hidden}
  video{width:100%;display:block;aspect-ratio:16/9;background:#000}
  .marks{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  .marks button{background:#1f6feb;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
  .marks button:hover{background:#388bfd}
  ol{line-height:1.9;font-size:15px;padding-left:22px}
  code{background:#161b22;padding:1px 6px;border-radius:6px;font-size:13px}
  .tip{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<main>
  <h1>PremierePop 本地验证 · 测试播放页</h1>
  <p class="sub">示例视频 Big Buck Bunny（约 9 分 56 秒）。PremierePop 测试版扩展会在本页注入弹幕层和观影房面板，用法与 Crunchyroll 播放页一致。</p>
  <div class="player">
    <video id="v" controls preload="metadata" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
  </div>
  <div class="marks">
    <button data-t="30">跳到 00:30</button>
    <button data-t="180">跳到 03:00</button>
    <button data-t="360">跳到 06:00</button>
    <button data-t="540">跳到 09:00</button>
  </div>
  <div class="tip">
    验证顺序：① 本页建房 → ② 复制本页链接在新标签打开、用房号以嘉宾加入 → ③ 房主播放/暂停/拖动，确认嘉宾跟随 → ④ 在上面 4 个标记点各发一条带编号的弹幕（如 <code>MARK-0030</code>）→ ⑤ 刷新页面重新播放，确认 4 条弹幕在各自时间点重现 → ⑥ 确认 Spoiler Shield 默认开启。
  </div>
</main>
<script>
  var v = document.getElementById('v');
  document.querySelectorAll('.marks button').forEach(function(b){
    b.addEventListener('click', function(){ v.currentTime = +b.dataset.t; v.play(); });
  });
</script>
</body>
</html>
